name: Publish playlist and guide

on:
  schedule:
    - cron: "0 10 * * *" # 04:00 in Mexico City
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the iptv-org grabber
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git "$RUNNER_TEMP/epg"
          cd "$RUNNER_TEMP/epg" && npm ci --ignore-scripts --no-audit --no-fund

      - name: Build guide
        run: EPG_REPO="$RUNNER_TEMP/epg" scripts/update_guide.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repository activity; re-enabling resets that.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/guide.yml/enable"
